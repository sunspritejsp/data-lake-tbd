name: data-lake-tbd

networks:
  default:
    name: data-lake-tbd

volumes:
  pgdata:
  silo_data:
  mariadb_data:
  airflow_db:
  airflow_logs:
  superset_home:

services:

  # ── Fonte: faz o papel do sistema transacional ──────────────
  postgres-fonte:
    image: postgres:15-alpine
    container_name: postgres-fonte
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-fonte:/docker-entrypoint-initdb.d:ro
      - ./data:/dados:ro
    healthcheck:
      # -h 127.0.0.1 é essencial: durante o init há um Postgres temporário que
      # só escuta no socket local. Sem o -h, o serviço ficaria healthy antes da carga.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

  # ── Armazenamento S3: SILO, fork comunitário do MinIO ───────
  silo:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: silo
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_USER}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD}
    volumes: ["silo_data:/data"]
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria os buckets e termina.
  silo-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: silo-init
    depends_on:
      silo: { condition: service_healthy }
    environment:
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mcli alias set lake http://silo:9000 "$$S3_USER" "$$S3_PASSWORD"
        for b in bronze prata ouro warehouse; do mcli mb --ignore-existing lake/$$b; done

  # ── Catálogo: Hive Metastore, com MariaDB por trás ──────────
  mariadb:
    image: mariadb:10.5
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${HMS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: hive
      MYSQL_PASSWORD: ${HMS_DB_PASSWORD}
    volumes: ["mariadb_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u hive -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  hive-metastore:
    # Só existe a tag latest, então a imagem é fixada pelo digest.
    image: bitsondatadev/hive-metastore@sha256:b44a186b6dcffafc6a72327aaa5912a5824feecb50718aaf661727ff6aef011b
    container_name: hive-metastore
    depends_on:
      mariadb: { condition: service_healthy }
      silo-init: { condition: service_completed_successfully }
    environment:
      METASTORE_DB_HOSTNAME: mariadb
      HMS_DB_PASSWORD: ${HMS_DB_PASSWORD}
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
    volumes:
      - ./hive/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9083"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── Motor SQL ───────────────────────────────────────────────
  trino:
    image: trinodb/trino:380
    container_name: trino
    depends_on:
      hive-metastore: { condition: service_healthy }
      postgres-fonte: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]
    environment:
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── Orquestração ────────────────────────────────────────────
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes: ["airflow_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: ./airflow
    image: data-lake-tbd/airflow
    container_name: airflow
    depends_on:
      postgres-airflow: { condition: service_healthy }
      trino: { condition: service_healthy }
      silo-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8082:8080"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Maceio
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres-airflow/airflow
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "15"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      PYTHONPATH: /opt/airflow/projeto
      PYTHONDONTWRITEBYTECODE: "1"
      PG_HOST: postgres-fonte
      PG_PORT: "5432"
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      S3_ENDPOINT: http://silo:9000
      S3_USER: ${S3_USER}
      S3_PASSWORD: ${S3_PASSWORD}
      TRINO_HOST: trino
      TRINO_PORT: "8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./pipeline:/opt/airflow/projeto/pipeline:ro
      - ./sql:/opt/airflow/projeto/sql:ro
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ── Visualização ────────────────────────────────────────────
  superset:
    build: ./superset
    image: data-lake-tbd/superset
    container_name: superset
    depends_on:
      trino: { condition: service_healthy }
    ports: ["127.0.0.1:8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_CONFIG_PATH: /app/projeto/superset_config.py
    volumes:
      - superset_home:/app/superset_home
      - ./superset:/app/projeto:ro
    command: ["bash", "/app/projeto/iniciar.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
